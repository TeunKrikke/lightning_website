apiVersion: 1

datasources:
  - name: PostgreSQL (Lightning DB)
    type: postgres
    access: proxy
    uid: lightning-postgres-datasource
    url: localhost:5432
    user: lightning_user
    database: lightning_db
    secureJsonData:
      password: lightning_pass
    jsonData:
      sslmode: disable
      postgresVersion: 15
    editable: true
